<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - BookWeb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .error-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        .error-code {
            font-size: 3em;
            color: #dc3545;
            font-weight: bold;
        }
        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
            color: #721c24;
        }
        .error-trace {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="text-center">
            <div class="error-code" th:text="${status}">Error</div>
            <h2 class="mt-3">Something went wrong</h2>
        </div>

        <div th:if="${message}" class="error-message">
            <strong>Message:</strong> <span th:text="${message}"></span>
        </div>

        <div th:if="${error}" class="error-message">
            <strong>Error Details:</strong>
            <p class="mt-2" th:text="${error}"></p>
        </div>

        <div th:if="${trace}" class="error-trace" th:text="${trace}"></div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
