<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng - Admin</title>
</head>
<body>
    <div th:fragment="content">
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2><i class="fas fa-users me-2"></i>Quản Lý Người Dùng</h2>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Tên Người Dùng</th>
                            <th>Email</th>
                            <th>Vai Trò</th>
                            <th>Trạng Thái</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}" th:unless="${users.isEmpty()}">
                            <td><strong th:text="${user.fullName}"></strong></td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span th:switch="${user.role}" class="badge">
                                    <span th:case="'admin'" class="badge bg-danger">Admin</span>
                                    <span th:case="'customer'" class="badge bg-info">Khách Hàng</span>
                                    <span th:case="*" class="badge bg-secondary">Khác</span>
                                </span>
                            </td>
                            <td>
                                <span th:switch="${user.status}" class="badge">
                                    <span th:case="'active'" class="badge bg-success">Hoạt Động</span>
                                    <span th:case="*" class="badge bg-warning">Không Hoạt Động</span>
                                </span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
                                    <button class="btn btn-info"><i class="fas fa-eye"></i></button>
                                    <button class="btn btn-danger" type="button"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${users.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="fas fa-inbox" style="font-size: 2em; margin-bottom: 10px;"></i>
                                <p>Không có người dùng nào</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
