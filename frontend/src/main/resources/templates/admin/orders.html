<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Admin</title>
</head>
<body>
    <div th:fragment="content">
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2><i class="fas fa-boxes me-2"></i>Quản Lý Đơn Hàng</h2>
            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Tìm kiếm đơn hàng...">
                    <button class="btn btn-primary" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Filter -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="btn-group" role="group">
                    <a th:href="@{/admin/orders}" class="btn btn-outline-primary" 
                       th:classappend="${selectedStatus == '' ? 'active' : ''}">Tất Cả</a>
                    <a th:href="@{/admin/orders(status='PENDING')}" class="btn btn-outline-primary"
                       th:classappend="${selectedStatus == 'PENDING' ? 'active' : ''}">Chưa Xử Lý</a>
                    <a th:href="@{/admin/orders(status='PROCESSING')}" class="btn btn-outline-primary"
                       th:classappend="${selectedStatus == 'PROCESSING' ? 'active' : ''}">Đang Xử Lý</a>
                    <a th:href="@{/admin/orders(status='SHIPPED')}" class="btn btn-outline-primary"
                       th:classappend="${selectedStatus == 'SHIPPED' ? 'active' : ''}">Đã Gửi</a>
                    <a th:href="@{/admin/orders(status='DELIVERED')}" class="btn btn-outline-primary"
                       th:classappend="${selectedStatus == 'DELIVERED' ? 'active' : ''}">Đã Giao</a>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Mã Đơn Hàng</th>
                            <th>Ngày Tạo</th>
                            <th>Tổng Tiền</th>
                            <th>Trạng Thái</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}" th:unless="${orders.isEmpty()}">
                            <td><strong th:text="${order.orderNumber}"></strong></td>
                            <td th:text="${order.createdAt}"></td>
                            <td style="color: #0066CC; font-weight: 700;" th:text="'₫' + ${#numbers.formatInteger(order.totalAmount, 0)}"></td>
                            <td>
                                <span th:switch="${order.status}" class="badge">
                                    <span th:case="'PENDING'" class="badge bg-warning text-dark">Chưa Xử Lý</span>
                                    <span th:case="'PROCESSING'" class="badge bg-info">Đang Xử Lý</span>
                                    <span th:case="'SHIPPED'" class="badge bg-primary">Đã Gửi</span>
                                    <span th:case="'DELIVERED'" class="badge bg-success">Đã Giao</span>
                                    <span th:case="'CONFIRMED'" class="badge" style="background:#6f42c1;">Đã Xác Nhận</span>
                                    <span th:case="'CANCELLED'" class="badge bg-danger">Đã Hủy</span>
                                    <span th:case="'pending'" class="badge bg-warning text-dark">Chưa Xử Lý</span>
                                    <span th:case="'processing'" class="badge bg-info">Đang Xử Lý</span>
                                    <span th:case="'shipped'" class="badge bg-primary">Đã Gửi</span>
                                    <span th:case="'delivered'" class="badge bg-success">Đã Giao</span>
                                    <span th:case="'confirmed'" class="badge" style="background:#6f42c1;">Đã Xác Nhận</span>
                                    <span th:case="'cancelled'" class="badge bg-danger">Đã Hủy</span>
                                    <span th:case="*" class="badge bg-secondary" th:text="${order.status}"></span>
                                </span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" 
                                       class="btn btn-primary">
                                        <i class="fas fa-eye"></i> Xem
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${orders.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="fas fa-inbox" style="font-size: 2em; margin-bottom: 10px;"></i>
                                <p>Không có đơn hàng</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
</body>
</html>
