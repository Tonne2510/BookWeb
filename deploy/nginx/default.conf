# --- Bước 1: HTTP only (lấy SSL cert) ---
# Dùng file này trước khi có SSL

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển tất cả sang HTTPS sau khi có cert
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # --- Tạm thời dùng HTTP trước khi có SSL ---
    # Frontend (Spring Boot)
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (Node.js GraphQL)
    location /graphql {
        proxy_pass http://backend:4000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OAuth routes
    location /auth/google {
        proxy_pass http://backend:4000/auth/google;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/github {
        proxy_pass http://backend:4000/auth/github;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/google/callback {
        proxy_pass http://backend:4000/auth/google/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/github/callback {
        proxy_pass http://backend:4000/auth/github/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MB Bank SSE payment
    location /payment/ {
        proxy_pass http://backend:4000/payment/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
    }

    # Health check
    location /health {
        proxy_pass http://backend:4000/health;
    }
}
