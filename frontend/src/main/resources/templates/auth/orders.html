<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Hàng Của Tôi - BookWeb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">📚 BookWeb</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Trang Chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/books">Sách</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auth/profile">Tài Khoản</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auth/logout">Đăng Xuất</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4"><i class="fas fa-box me-2"></i>Đơn Hàng Của Tôi</h2>

        <div th:if="${orders == null || orders.isEmpty()}" class="text-center py-5">
            <i class="fas fa-inbox" style="font-size: 4em; color: #ccc;"></i>
            <h4 class="mt-3 text-muted">Bạn chưa có đơn hàng nào</h4>
            <a href="/books" class="btn btn-primary mt-3"><i class="fas fa-shopping-bag me-1"></i>Mua Sắm Ngay</a>
        </div>

        <div th:if="${orders != null && !orders.isEmpty()}" class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Mã Đơn</th>
                        <th>Sản Phẩm</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th>Ngày Đặt</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td><strong th:text="${order.orderNumber}">ORD-001</strong></td>
                        <td>
                            <div th:each="item : ${order.items}">
                                <span th:text="${item.book != null ? item.book.title : 'Sản phẩm'}">Sách</span>
                                <small class="text-muted"> x<span th:text="${item.quantity}">1</span></small>
                            </div>
                        </td>
                        <td style="color: #0066CC; font-weight: 700;" th:text="'₫' + ${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')}">₫0</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${order.status == 'pending' ? 'bg-warning text-dark' : (order.status == 'processing' ? 'bg-info' : (order.status == 'shipped' ? 'bg-primary' : (order.status == 'delivered' ? 'bg-success' : 'bg-danger')))}"
                                  th:text="${order.status == 'pending' ? 'Chờ xử lý' : (order.status == 'processing' ? 'Đang xử lý' : (order.status == 'shipped' ? 'Đang giao' : (order.status == 'delivered' ? 'Đã giao' : 'Đã hủy')))}">
                            </span>
                        </td>
                        <td th:text="${order.createdAt != null ? #strings.substring(order.createdAt, 0, 10) : '-'}">2024-01-01</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container text-center">
            <p>&copy; 2024 BookWeb. Tất cả quyền được bảo lưu.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
