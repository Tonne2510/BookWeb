<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - BookWeb</title>
</head>
<body>
    <div th:fragment="content">
    <div class="container mt-5" style="max-width: 900px;">
        <h1><i class="fas fa-credit-card me-2"></i>Thanh Toán Đơn Hàng</h1>
        <hr/>

        <form method="POST" action="/cart/checkout" class="needs-validation">
            <div class="row">
                <!-- Shipping Info -->
                <div class="col-lg-8">
                    <!-- Customer Info -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-info text-white">
                            <h5 class="mb-0"><i class="fas fa-user me-2"></i>Thông Tin Khách Hàng</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fullName" class="form-label">Họ Tên *</label>
                                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Số Điện Thoại *</label>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="0123456789" required>
                            </div>
                        </div>
                    </div>

                    <!-- Shipping Address -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-map-marker-alt me-2"></i>Địa Chỉ Giao Hàng</h5>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="city" class="form-label">Tỉnh/Thành Phố *</label>
                                    <input type="text" class="form-control" id="city" name="city" placeholder="TP. Hồ Chí Minh" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="district" class="form-label">Quận/Huyện *</label>
                                    <input type="text" class="form-control" id="district" name="district" placeholder="Quận 1" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="shippingAddress" class="form-label">Địa Chỉ Chi Tiết *</label>
                                <textarea class="form-control" id="shippingAddress" name="shippingAddress" 
                                          rows="3" placeholder="Số nhà, đường phố, tòa nhà, v.v." required></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Method -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-wallet me-2"></i>Phương Thức Thanh Toán</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="paymentMethod" 
                                       id="paymentCOD" value="COD" checked required>
                                <label class="form-check-label" for="paymentCOD">
                                    <strong>Thanh Toán Khi Nhận Hàng (COD)</strong>
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="paymentMethod" 
                                       id="paymentBank" value="BANK_TRANSFER" required>
                                <label class="form-check-label" for="paymentBank">
                                    <strong>Chuyển Khoản Ngân Hàng</strong>
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="paymentMethod" 
                                       id="paymentCard" value="CREDIT_CARD" required>
                                <label class="form-check-label" for="paymentCard">
                                    <strong>Thẻ Tín Dụng</strong>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="card shadow-sm" style="position: sticky; top: 20px;">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-list me-2"></i>Tóm Tắt Đơn Hàng</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <h6>Chi Tiết Sản Phẩm:</h6>
                                <div th:each="item : ${cart.items}" class="d-flex justify-content-between mb-2 small">
                                    <div>
                                        <div th:text="${item.title}"></div>
                                        <small class="text-muted" th:text="'x' + ${item.quantity}"></small>
                                    </div>
                                    <div th:text="'₫' + ${#numbers.formatInteger(item.price * item.quantity, 0)}"></div>
                                </div>
                                <hr/>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between mb-2">
                                    <strong>Tổng Sản Phẩm:</strong>
                                    <strong th:text="${cart.count}"></strong>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <strong>Tạm Tính:</strong>
                                    <strong th:text="'₫' + ${#numbers.formatInteger(cartTotal, 0)}"></strong>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <strong>Phí Vận Chuyển:</strong>
                                    <strong style="color: green;">Miễn Phí</strong>
                                </div>
                                <hr/>
                                <div class="d-flex justify-content-between">
                                    <h5>Tổng Cộng:</h5>
                                    <h5 style="color: #0066CC;" th:text="'₫' + ${#numbers.formatInteger(cartTotal, 0)}"></h5>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="fas fa-check-circle me-2"></i>Xác Nhận Thanh Toán
                            </button>
                            <a href="/cart" class="btn btn-outline-secondary w-100 mt-2">
                                <i class="fas fa-arrow-left me-2"></i>Quay Lại
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    </div>
</body>
</html>
