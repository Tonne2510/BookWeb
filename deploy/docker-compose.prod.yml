version: '3.8'

# ============================================
# BookWeb Production - Hetzner Cloud x86_64
# Tối ưu cho CAX11 (4GB RAM)
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: bookweb-db
    restart: always
    env_file:
      - .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: bookweb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bookweb-network
    deploy:
      resources:
        limits:
          memory: 1G
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=50
      --key-buffer-size=16M
      --table-open-cache=200
      --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bookweb-backend
    restart: always
    env_file:
      - .env.prod
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bookweb
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bookweb-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bookweb-frontend
    restart: always
    environment:
      GRAPHQL_ENDPOINT: http://backend:4000/graphql
      BACKEND_BASE_URL: http://backend:4000
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      - backend
    networks:
      - bookweb-network

  nginx:
    image: nginx:alpine
    container_name: bookweb-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/default-ssl.conf:/etc/nginx/conf.d/default-ssl.conf
      - ./letsencrypt:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - frontend
      - backend
    networks:
      - bookweb-network

  # Auto-renew SSL
  certbot:
    image: certbot/certbot
    container_name: bookweb-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:
  certbot_data:

networks:
  bookweb-network:
    driver: bridge
