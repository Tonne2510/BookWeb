<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục - Admin</title>
</head>
<body>
    <div th:fragment="content">
        <div class="container-fluid mt-4">
            <div class="row mb-4">
                <div class="col-md-8">
                    <h2><i class="fas fa-list me-2"></i>Quản Lý Danh Mục</h2>
                </div>
                <div class="col-md-4">
                    <a href="/admin/categories/create" class="btn btn-primary float-end">
                        <i class="fas fa-plus me-2"></i>Thêm Danh Mục Mới
                    </a>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Tên Danh Mục</th>
                                <th>Slug</th>
                                <th>Trạng Thái</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category : ${categories}" th:unless="${categories.isEmpty()}">
                                <td><strong th:text="${category.name}"></strong></td>
                                <td th:text="${category.slug}"></td>
                                <td>
                                    <span th:switch="${category.status}" class="badge">
                                        <span th:case="'active'" class="badge bg-success">Hoạt Động</span>
                                        <span th:case="*" class="badge bg-warning">Không Hoạt Động</span>
                                    </span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}" class="btn btn-warning"><i class="fas fa-edit"></i></a>
                                        <button class="btn btn-danger" type="button"><i class="fas fa-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${categories.isEmpty()}">
                                <td colspan="4" class="text-center text-muted py-5">
                                    <i class="fas fa-inbox" style="font-size: 2em; margin-bottom: 10px;"></i>
                                    <p>Không có danh mục nào</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
