<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Search Results for: ' + ${searchTerm}">Search Results - BookWeb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">📚 BookWeb</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Books</a>
                    </li>
                    <li class="nav-item" th:if="${session.token == null}">
                        <a class="nav-link" href="/auth/login">Login</a>
                    </li>
                    <li class="nav-item" th:if="${session.token != null}">
                        <a class="nav-link" href="/auth/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Search Results -->
    <div class="container py-5">
        <h2 class="mb-4" th:text="'Search Results for: ' + ${searchTerm}">Search Results</h2>

        <div th:if="${books.isEmpty()}" class="alert alert-info">
            No books found matching your search.
        </div>

        <div class="row g-4" th:if="${!books.isEmpty()}">
            <div class="col-md-6 col-lg-4" th:each="book : ${books}">
                <div class="card h-100">
                    <img th:src="${book.coverImage}" class="card-img-top" alt="Book Cover" style="height: 300px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${book.title}">Book Title</h5>
                        <p class="card-text text-muted text-truncate" th:text="${book.description}">Description</p>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted" style="text-decoration: line-through;" th:if="${book.discount > 0}" th:text="'$' + ${book.price}">Price</span>
                            <span class="h5 mb-0" th:text="'$' + ${book.finalPrice}">Final Price</span>
                        </div>
                        <a class="btn btn-primary w-100" th:href="'/books/' + ${book.slug}">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container text-center">
            <p>&copy; 2024 BookWeb. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
