<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Mật Khẩu - BookWeb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .reset-password-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .reset-header {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
        }
        
        .reset-header h1 {
            font-size: 2em;
            margin: 15px 0 10px 0;
            font-weight: 800;
        }
        
        .reset-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .reset-header i {
            font-size: 3.5em;
            margin-bottom: 10px;
        }
        
        .reset-body {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-control {
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background-color: white;
            border-color: #0066CC;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            outline: none;
        }

        .form-control.error {
            border-color: #c41e3a;
            background-color: #ffe5e5;
        }
        
        .form-label {
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-size: 0.95rem;
        }
        
        .password-strength {
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .strength-bar {
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            background-color: #ff6b6b;
        }

        .strength-bar-fill.weak {
            width: 33%;
            background-color: #ff6b6b;
        }

        .strength-bar-fill.medium {
            width: 66%;
            background-color: #fbb034;
        }

        .strength-bar-fill.strong {
            width: 100%;
            background-color: #51cf66;
        }

        .strength-text {
            color: #666;
            font-weight: 500;
        }

        .match-indicator {
            margin-top: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-indicator.match {
            color: #51cf66;
        }

        .match-indicator.no-match {
            color: #c41e3a;
        }

        .match-indicator i {
            font-weight: bold;
        }

        .reset-btn {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        
        .reset-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.4);
            color: white;
        }

        .reset-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .reset-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
        }

        .alert-danger {
            background-color: #ffe5e5;
            color: #c41e3a;
            border-left: 4px solid #c41e3a;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #155724;
        }
        
        .back-to-login {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .back-to-login a {
            color: #0066CC;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-to-login a:hover {
            color: #1A73E8;
            text-decoration: underline;
        }

        .password-requirements {
            background-color: #f0f7ff;
            border-left: 4px solid #0066CC;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #333;
        }

        .password-requirements i {
            color: #0066CC;
            margin-right: 8px;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.85rem;
        }

        .requirement.met {
            color: #51cf66;
        }

        .requirement.not-met {
            color: #999;
        }

        .requirement i {
            width: 16px;
            text-align: center;
            color: inherit;
        }
    </style>
</head>
<body>
    <div class="reset-password-container">
        <div class="reset-header">
            <i class="fas fa-lock-open"></i>
            <h1>Reset Mật Khẩu</h1>
            <p>Tạo mật khẩu mới cho tài khoản của bạn</p>
        </div>
        
        <div class="reset-body">
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${success}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span>Mật khẩu của bạn đã được reset thành công! <a href="/auth/login">Đăng nhập ngay</a></span>
            </div>

            <form method="post" action="/auth/reset-password" id="resetForm">
                <input type="hidden" name="token" th:value="${token}">

                <div class="password-requirements">
                    <i class="fas fa-shield-alt"></i>
                    <strong>Yêu cầu mật khẩu:</strong>
                    <div class="requirement not-met" id="lengthReq">
                        <i class="fas fa-check-circle"></i>
                        <span>Ít nhất 6 ký tự</span>
                    </div>
                    <div class="requirement not-met" id="uppercaseReq">
                        <i class="fas fa-check-circle"></i>
                        <span>Ít nhất một chữ hoa (A-Z)</span>
                    </div>
                    <div class="requirement not-met" id="numberReq">
                        <i class="fas fa-check-circle"></i>
                        <span>Ít nhất một số (0-9)</span>
                    </div>
                    <div class="requirement not-met" id="specialReq">
                        <i class="fas fa-check-circle"></i>
                        <span>Ít nhất một ký tự đặc biệt (!@#$%^&*)</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-2" style="color: #0066CC;"></i>Mật Khẩu Mới
                    </label>
                    <input type="password" class="form-control" id="password" name="password" required 
                           placeholder="Nhập mật khẩu mới">
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-bar-fill" id="strengthBar"></div>
                        </div>
                        <div class="strength-text" id="strengthText">Cố gắng hơn...</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        <i class="fas fa-lock me-2" style="color: #0066CC;"></i>Xác Nhận Mật Khẩu
                    </label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                           placeholder="Nhập lại mật khẩu">
                    <div class="match-indicator" id="matchIndicator">
                        <i class="fas fa-times-circle"></i>
                        <span>Mật khẩu chưa trùng khớp</span>
                    </div>
                </div>

                <button type="submit" class="reset-btn" id="resetBtn" disabled>
                    <i class="fas fa-shield-alt me-2"></i>Reset Mật Khẩu
                </button>
            </form>

            <div class="back-to-login">
                <a href="/auth/login">
                    <i class="fas fa-arrow-left"></i>Quay lại trang đăng nhập
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const matchIndicator = document.getElementById('matchIndicator');
        const form = document.getElementById('resetForm');

        // Password strength requirements
        const lengthReq = document.getElementById('lengthReq');
        const uppercaseReq = document.getElementById('uppercaseReq');
        const numberReq = document.getElementById('numberReq');
        const specialReq = document.getElementById('specialReq');

        function checkPasswordStrength(password) {
            let strength = 0;
            let requirements = {
                length: password.length >= 6,
                uppercase: /[A-Z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*]/.test(password)
            };

            // Update requirement indicators
            updateRequirement(lengthReq, requirements.length);
            updateRequirement(uppercaseReq, requirements.uppercase);
            updateRequirement(numberReq, requirements.number);
            updateRequirement(specialReq, requirements.special);

            // Calculate strength
            if (requirements.length) strength++;
            if (requirements.uppercase) strength++;
            if (requirements.number) strength++;
            if (requirements.special) strength++;

            // Update strength bar
            strengthBar.className = 'strength-bar-fill';
            if (strength === 0) {
                strengthBar.classList.remove('weak', 'medium', 'strong');
                strengthText.textContent = 'Cố gắng hơn...';
            } else if (strength <= 2) {
                strengthBar.classList.add('weak');
                strengthText.textContent = 'Yếu';
            } else if (strength === 3) {
                strengthBar.classList.add('medium');
                strengthText.textContent = 'Trung bình';
            } else {
                strengthBar.classList.add('strong');
                strengthText.textContent = 'Mạnh';
            }

            return requirements;
        }

        function updateRequirement(element, isMet) {
            element.classList.remove('met', 'not-met');
            if (isMet) {
                element.classList.add('met');
                element.querySelector('i').className = 'fas fa-check-circle';
            } else {
                element.classList.add('not-met');
                element.querySelector('i').className = 'fas fa-circle';
            }
        }

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const match = password === confirmPassword && password.length > 0;

            matchIndicator.classList.remove('match', 'no-match');
            if (confirmPassword.length > 0) {
                if (match) {
                    matchIndicator.classList.add('match');
                    matchIndicator.innerHTML = '<i class="fas fa-check-circle"></i><span>Mật khẩu trùng khớp</span>';
                } else {
                    matchIndicator.classList.add('no-match');
                    matchIndicator.innerHTML = '<i class="fas fa-times-circle"></i><span>Mật khẩu chưa trùng khớp</span>';
                }
            } else {
                matchIndicator.classList.add('no-match');
                matchIndicator.innerHTML = '<i class="fas fa-times-circle"></i><span>Mật khẩu chưa trùng khớp</span>';
            }

            return match;
        }

        function updateSubmitButton() {
            const password = passwordInput.value;
            const requirements = checkPasswordStrength(password);
            const isMatching = checkPasswordMatch();
            const allRequirementsMet = requirements.length && requirements.uppercase && requirements.number && requirements.special;

            resetBtn.disabled = !allRequirementsMet || !isMatching;
        }

        passwordInput.addEventListener('input', updateSubmitButton);
        confirmPasswordInput.addEventListener('input', updateSubmitButton);

        form.addEventListener('submit', function(e) {
            if (passwordInput.value !== confirmPasswordInput.value) {
                e.preventDefault();
                alert('Mật khẩu không trùng khớp!');
                return false;
            }
        });

        // Initial check
        updateSubmitButton();
    </script>
</body>
</html>
