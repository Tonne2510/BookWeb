<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - BookWeb</title>
</head>
<body>
    <div th:fragment="content">
    <div class="container mt-5">
        <h1><i class="fas fa-shopping-cart me-2"></i>Giỏ Hàng Của Bạn</h1>
        <hr/>

        <div th:if="${cartItems != null and cartItems.size() > 0}">
            <div class="row">
                <!-- Cart Items -->
                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Sách</th>
                                        <th>Giá</th>
                                        <th>Số Lượng</th>
                                        <th>Tổng</th>
                                        <th>Hành Động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${cartItems}">
                                        <td>
                                            <div style="display: flex; gap: 10px; align-items: center;">
                                                <img th:src="${item.coverImage != null and !item.coverImage.isEmpty()} ? ${item.coverImage} : 'https://via.placeholder.com/50x70?text=No+Image'" 
                                                     style="width: 50px; height: 70px; object-fit: cover; border-radius: 4px; background: #f0f0f0;"
                                                     onerror="this.src='https://via.placeholder.com/50x70?text=No+Image'">
                                                <div>
                                                    <h6 th:text="${item.title}"></h6>
                                                </div>
                                            </div>
                                        </td>
                                        <td th:text="'₫' + ${#numbers.formatInteger(item.price, 0)}"></td>
                                        <td>
                                            <input type="number" class="form-control quantity-input" 
                                                   th:data-book-id="${item.bookId}" 
                                                   th:value="${item.quantity}" 
                                                   min="1" style="width: 80px;">
                                        </td>
                                        <td th:text="'₫' + ${#numbers.formatInteger(item.price * item.quantity, 0)}"></td>
                                        <td>
                                            <button class="btn btn-sm btn-danger remove-item" 
                                                    th:data-book-id="${item.bookId}">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Cart Summary -->
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Tóm Tắt Đơn Hàng</h5>
                            <hr/>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Tổng Sản Phẩm:</span>
                                <strong th:text="${cartCount}"></strong>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span>Tổng Tiền:</span>
                                <h4 style="color: #0066CC;" th:text="'₫' + ${#numbers.formatInteger(cartTotal, 0)}"></h4>
                            </div>
                            <hr/>
                            <a href="/cart/checkout" class="btn btn-primary w-100 mb-2">
                                <i class="fas fa-credit-card me-2"></i>Thực Hiện Thanh Toán
                            </a>
                            <a href="/books" class="btn btn-outline-primary w-100">
                                <i class="fas fa-shopping-bag me-2"></i>Tiếp Tục Mua Sắm
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty Cart -->
        <div th:if="${cartItems == null or cartItems.size() == 0}" class="alert alert-info text-center mt-5">
            <i class="fas fa-inbox" style="font-size: 3em; margin-bottom: 15px;"></i>
            <h5 class="mt-3">Giỏ Hàng Của Bạn Đang Trống</h5>
            <p>Hãy thêm những cuốn sách yêu thích vào giỏ hàng</p>
            <a href="/books" class="btn btn-primary mt-3">Bắt Đầu Mua Sắm</a>
        </div>
    </div>

    <script>
        // Handle quantity change
        document.querySelectorAll('.quantity-input').forEach(input => {
            input.addEventListener('change', function() {
                const bookId = this.dataset.bookId;
                const quantity = this.value;
                updateQuantity(bookId, quantity);
            });
        });

        // Handle remove item
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', function() {
                const bookId = this.dataset.bookId;
                removeFromCart(bookId);
            });
        });

        function updateQuantity(bookId, quantity) {
            fetch(`/cart/update/${bookId}/${quantity}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    }
                });
        }

        function removeFromCart(bookId) {
            if (confirm('Bạn có chắc muốn xóa sản phẩm này?')) {
                fetch(`/cart/remove/${bookId}`, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            location.reload();
                        }
                    });
            }
        }
    </script>
    </div>
</body>
</html>
