<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Giỏ Hàng Test</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="container mt-5">
    <h1><i class="fas fa-shopping-cart"></i> Giỏ Hàng Của Bạn</h1>
    <hr />

    <div th:if="${cartItems == null}">
      <div class="alert alert-warning">
        Cảnh báo: Biến 'cartItems' đang bị NULL từ Java gửi sang!
      </div>
    </div>

    <table class="table" th:if="${cartItems != null}">
      <thead>
        <tr>
          <th>Tên Sách</th>
          <th>Số lượng</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${cartItems}">
          <td th:text="${item.title}">Tên mặc định</td>
          <td th:text="${item.quantity}">0</td>
        </tr>
      </tbody>
    </table>

    <div class="mt-4">
      <p>Tổng tiền: <span th:text="${cartTotal}">0</span> VNĐ</p>
      <a href="/cart/checkout" class="btn btn-success">Đi đến Thanh Toán</a>
    </div>
  </body>
</html>
