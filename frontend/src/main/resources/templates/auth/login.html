<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - BookWeb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
        }
        
        .login-header h1 {
            font-size: 2.5em;
            margin: 15px 0 10px 0;
            font-weight: 800;
        }
        
        .login-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95em;
        }

        .login-header i {
            font-size: 3.5em;
            margin-bottom: 10px;
        }
        
        .login-body {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-control {
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background-color: white;
            border-color: #0066CC;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            outline: none;
        }
        
        .form-label {
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-size: 0.95rem;
        }
        
        .login-btn {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.4);
            color: white;
        }

        .login-btn:active {
            transform: translateY(0);
        }
        
        .alert {
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
        }

        .alert-danger {
            background-color: #ffe5e5;
            color: #c41e3a;
            border-left: 4px solid #c41e3a;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #155724;
        }

        .forgot-password-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password-link a {
            color: #0066CC;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .forgot-password-link a:hover {
            color: #1A73E8;
            text-decoration: underline;
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #999;
            position: relative;
        }

        .divider::before {
            content: '';
            display: inline-block;
            width: 40%;
            height: 1px;
            background: #ddd;
            vertical-align: middle;
            margin-right: 10px;
        }
        
        .divider::after {
            content: '';
            display: inline-block;
            width: 40%;
            height: 1px;
            background: #ddd;
            vertical-align: middle;
            margin-left: 10px;
        }
        
        .oauth-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            background-color: white;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .oauth-btn:hover {
            border-color: #0066CC;
            color: #0066CC;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.15);
        }
        
        .login-footer {
            margin-top: 25px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }

        .login-footer p {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 0.95rem;
        }

        .register-btn {
            display: block;
            background-color: #f5f5f5;
            color: #0066CC;
            border: 2px solid #0066CC;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
        }

        .register-btn:hover {
            background-color: #0066CC;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-book"></i>
            <h1>BookWeb</h1>
            <p>Cửa hàng sách trực tuyến hàng đầu</p>
        </div>
        
        <div class="login-body">
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${message}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${message}"></span>
            </div>

            <form method="post" action="/auth/login" id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-2" style="color: #0066CC;"></i>Email
                    </label>
                    <input type="email" class="form-control" id="email" name="email" required 
                           placeholder="Nhập email của bạn" autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-2" style="color: #0066CC;"></i>Mật khẩu
                    </label>
                    <input type="password" class="form-control" id="password" name="password" required
                           placeholder="Nhập mật khẩu">
                </div>

                <div class="forgot-password-link">
                    <a href="/auth/forgot-password">
                        <i class="fas fa-question-circle me-1"></i>Quên mật khẩu?
                    </a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập
                </button>
            </form>

            <div class="divider">hoặc</div>

            <div class="oauth-buttons">
                <a href="/auth/google" class="oauth-btn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </a>
                <a href="/auth/github" class="oauth-btn">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </a>
            </div>

            <div class="login-footer">
                <p>Chưa có tài khoản?</p>
                <a href="/auth/register" class="register-btn">
                    <i class="fas fa-user-plus me-2"></i>Tạo Tài Khoản Mới
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
