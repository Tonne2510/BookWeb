<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoàn Tất Hồ Sơ - BookWeb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .card-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-header {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            color: white;
            padding: 35px 30px 28px;
            text-align: center;
        }
        .card-header i { font-size: 2.8em; margin-bottom: 8px; display: block; }
        .card-header h1 { font-size: 1.9em; font-weight: 800; margin: 0 0 6px; }
        .card-header p { margin: 0; opacity: 0.9; font-size: 0.93em; }
        .card-body { padding: 32px 38px; }
        .info-box {
            background: #f0f7ff;
            border: 1px solid #b3d4f5;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #0055aa;
        }
        .info-box i { font-size: 1.2rem; flex-shrink: 0; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-weight: 700; color: #333; margin-bottom: 7px; display: block; font-size: 0.92rem; }
        .form-control {
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.97em;
            transition: all 0.3s ease;
            width: 100%;
        }
        .form-control:focus {
            background-color: white;
            border-color: #0066CC;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
            outline: none;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-hint { font-size: 0.78rem; color: #888; margin-top: 4px; }
        .email-display {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.97em;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            border: none; color: white;
            padding: 13px; border-radius: 8px;
            font-weight: 700; font-size: 1rem;
            width: 100%; margin-top: 8px;
            cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,102,204,0.4); }
        .alert { border-radius: 8px; border: none; margin-bottom: 18px; }
        .alert-danger  { background-color: #ffe5e5; color: #c41e3a; border-left: 4px solid #c41e3a; }
        .alert-success { background-color: #d4edda; color: #155724; border-left: 4px solid #155724; }
        .skip-link {
            text-align: center;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #eee;
        }
        .skip-link a { color: #888; font-size: 0.88rem; text-decoration: none; }
        .skip-link a:hover { color: #0066CC; }
    </style>
</head>
<body>
<div class="card-container">
    <div class="card-header">
        <i class="fas fa-user-circle"></i>
        <h1>BookWeb</h1>
        <p>Hoàn Tất Thông Tin Cá Nhân</p>
    </div>
    <div class="card-body">

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="info-box">
            <i class="fab fa-google"></i>
            <span>Bạn vừa đăng nhập bằng Google. Vui lòng xác nhận thông tin bên dưới.</span>
        </div>

        <form method="post" action="/auth/complete-profile">

            <!-- Email (read-only) -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-envelope me-2" style="color:#0066CC;"></i>Email
                </label>
                <div class="email-display">
                    <i class="fas fa-check-circle" style="color:#28a745;"></i>
                    <span th:text="${user != null ? user.email : ''}"></span>
                </div>
            </div>

            <!-- Họ / Tên -->
            <div class="form-row">
                <div class="form-group">
                    <label for="lastName" class="form-label">
                        <i class="fas fa-user me-2" style="color:#0066CC;"></i>Họ
                    </label>
                    <input type="text" class="form-control" id="lastName" name="lastName"
                           required placeholder="Nhập họ"
                           th:value="${user != null ? user.lastName : ''}">
                </div>
                <div class="form-group">
                    <label for="firstName" class="form-label">
                        <i class="fas fa-user me-2" style="color:#0066CC;"></i>Tên
                    </label>
                    <input type="text" class="form-control" id="firstName" name="firstName"
                           required placeholder="Nhập tên"
                           th:value="${user != null ? user.firstName : ''}">
                </div>
            </div>

            <!-- Số điện thoại (không bắt buộc) -->
            <div class="form-group">
                <label for="phone" class="form-label">
                    <i class="fas fa-phone me-2" style="color:#0066CC;"></i>Số Điện Thoại
                    <span style="font-weight:400; color:#888;">(không bắt buộc)</span>
                </label>
                <input type="tel" class="form-control" id="phone" name="phone"
                       placeholder="VD: 0901234567"
                       th:value="${user != null ? user.phone : ''}">
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-check me-2"></i>Xác Nhận &amp; Vào Trang Chủ
            </button>
        </form>

        <div class="skip-link">
            <a href="/"><i class="fas fa-forward me-1"></i>Bỏ qua, vào trang chủ ngay</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
