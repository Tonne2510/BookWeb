<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - BookWeb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .register-header {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            color: white;
            padding: 40px 30px 30px;
            text-align: center;
        }
        .register-header i { font-size: 3em; margin-bottom: 8px; display: block; }
        .register-header h1 { font-size: 2.2em; font-weight: 800; margin: 0 0 6px; }
        .register-header p { margin: 0; opacity: 0.9; font-size: 0.95em; }
        .register-body { padding: 35px 40px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-weight: 700; color: #333; margin-bottom: 7px; display: block; font-size: 0.93rem; }
        .form-control {
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.98em;
            transition: all 0.3s ease;
            width: 100%;
        }
        .form-control:focus {
            background-color: white;
            border-color: #0066CC;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
            outline: none;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
        .register-btn {
            background: linear-gradient(135deg, #0066CC 0%, #1A73E8 100%);
            border: none; color: white;
            padding: 13px; border-radius: 8px;
            font-weight: 700; font-size: 1rem;
            width: 100%; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 0.5px;
            cursor: pointer; margin-top: 10px;
        }
        .register-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,102,204,0.4); }
        .alert { border-radius: 8px; border: none; margin-bottom: 20px; }
        .alert-danger  { background-color: #ffe5e5; color: #c41e3a; border-left: 4px solid #c41e3a; }
        .alert-success { background-color: #d4edda; color: #155724; border-left: 4px solid #155724; }
        .alert-info    { background-color: #cce5ff; color: #004085; border-left: 4px solid #004085; }
        .login-links {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e0e0e0;
        }
        .login-links p { margin: 0 0 8px; color: #666; font-size: 0.93rem; }
        .login-links a { color: #0066CC; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .login-links a:hover { color: #1A73E8; text-decoration: underline; }
        .otp-row { display: flex; gap: 10px; align-items: flex-end; }
        .otp-row .form-control { flex: 1; letter-spacing: 4px; font-size: 1.15rem; font-weight: 700; text-align: center; }
        .btn-send-otp {
            background: #0066CC; color: white; border: none;
            padding: 11px 15px; border-radius: 8px; font-weight: 600;
            white-space: nowrap; cursor: pointer; transition: background 0.3s; font-size: 0.88rem;
            flex-shrink: 0;
        }
        .btn-send-otp:hover { background: #1A73E8; }
        .btn-send-otp:disabled { background: #9eb8d9; cursor: not-allowed; }
        .otp-hint { font-size: 0.8rem; color: #888; margin-top: 5px; min-height: 16px; }
        .divider { height: 1px; background: #eee; margin: 10px 0 18px; }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-header">
        <i class="fas fa-book"></i>
        <h1>BookWeb</h1>
        <p>Tạo Tài Khoản Mới</p>
    </div>
    <div class="register-body">

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:if="${message}" class="alert alert-success">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${message}"></span>
        </div>
        <div id="alertBox" style="display:none;" class="alert"></div>

        <form method="post" action="/auth/register" id="registerForm">
            <input type="hidden" name="otp" id="hiddenOtp">

            <!-- Email + Gửi mã -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-envelope me-2" style="color:#0066CC;"></i>Địa Chỉ Email
                </label>
                <div class="otp-row">
                    <input type="email" class="form-control" id="emailInput" name="email"
                           required placeholder="Nhập email thật của bạn"
                           style="letter-spacing:normal; font-size:0.98rem;">
                    <button type="button" class="btn-send-otp" id="btnSendOtp" onclick="sendOtp()">
                        <i class="fas fa-paper-plane me-1"></i>Gửi mã
                    </button>
                </div>
                <div class="otp-hint" id="otpHint"></div>
            </div>

            <!-- OTP input -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-shield-alt me-2" style="color:#0066CC;"></i>Mã Xác Nhận (6 số)
                </label>
                <input type="text" class="form-control" id="otpInput"
                       placeholder="Nhập mã từ email" maxlength="6" inputmode="numeric"
                       style="letter-spacing:normal; font-size:0.98rem; font-weight:normal; text-align:left;">
            </div>

            <div class="divider"></div>

            <!-- Họ tên -->
            <div class="form-row">
                <div class="form-group">
                    <label for="lastName" class="form-label">
                        <i class="fas fa-user me-2" style="color:#0066CC;"></i>Họ
                    </label>
                    <input type="text" class="form-control" id="lastName" name="lastName"
                           required placeholder="Nhập họ của bạn">
                </div>
                <div class="form-group">
                    <label for="firstName" class="form-label">
                        <i class="fas fa-user me-2" style="color:#0066CC;"></i>Tên
                    </label>
                    <input type="text" class="form-control" id="firstName" name="firstName"
                           required placeholder="Nhập tên của bạn">
                </div>
            </div>

            <!-- Mật khẩu -->
            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock me-2" style="color:#0066CC;"></i>Mật Khẩu
                </label>
                <input type="password" class="form-control" id="password" name="password"
                       required placeholder="Ít nhất 6 ký tự" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword" class="form-label">
                    <i class="fas fa-lock me-2" style="color:#0066CC;"></i>Xác Nhận Mật Khẩu
                </label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                       required placeholder="Nhập lại mật khẩu" minlength="6">
            </div>

            <button type="submit" class="register-btn">
                <i class="fas fa-user-plus me-2"></i>Tạo Tài Khoản
            </button>
        </form>

        <div class="login-links">
            <p>Đã có tài khoản?</p>
            <a href="/auth/login"><i class="fas fa-sign-in-alt"></i>Đăng Nhập Ngay</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let countdownTimer = null;

    function showAlert(msg, type) {
        const el = document.getElementById('alertBox');
        el.style.display = 'block';
        el.className = 'alert alert-' + type;
        el.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : type === 'info' ? 'info-circle' : 'exclamation-circle') + ' me-2"></i>' + msg;
    }

    function startCountdown(sec) {
        clearInterval(countdownTimer);
        const btn = document.getElementById('btnSendOtp');
        const hint = document.getElementById('otpHint');
        btn.disabled = true;
        let t = sec;
        hint.textContent = 'Gửi lại sau ' + t + 's';
        countdownTimer = setInterval(() => {
            t--;
            if (t <= 0) {
                clearInterval(countdownTimer);
                hint.textContent = '';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-redo me-1"></i>Gửi lại';
            } else {
                hint.textContent = 'Gửi lại sau ' + t + 's';
            }
        }, 1000);
    }

    function sendOtp() {
        const email = document.getElementById('emailInput').value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showAlert('Vui lòng nhập địa chỉ email hợp lệ.', 'danger');
            return;
        }
        const btn = document.getElementById('btnSendOtp');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Đang gửi...';

        const fd = new FormData();
        fd.append('email', email);

        fetch('/auth/send-otp', { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showAlert(data.message, 'success');
                    startCountdown(60);
                } else {
                    showAlert(data.message, 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i>Gửi mã';
                }
            })
            .catch(() => {
                showAlert('Lỗi kết nối. Vui lòng thử lại.', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i>Gửi mã';
            });
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const otp = document.getElementById('otpInput').value.trim();
        if (!otp || otp.length !== 6 || !/^\d{6}$/.test(otp)) {
            showAlert('Vui lòng nhập mã xác nhận 6 số từ email.', 'danger');
            return;
        }

        const pwd = document.getElementById('password').value;
        const cpwd = document.getElementById('confirmPassword').value;
        if (pwd !== cpwd) {
            showAlert('Mật khẩu không trùng khớp!', 'danger');
            return;
        }

        document.getElementById('hiddenOtp').value = otp;
        this.submit();
    });
</script>
</body>
</html>
